<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>浄めばやし OGP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&display=swap">
<style>
  /* 撮り方: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu --hide-scrollbars
     --force-device-scale-factor=2 --window-size=1200,600 --screenshot=ogp.png scripts/ogp-card.html  → 1200×600（2:1） */
  html,body{margin:0;width:1200px;height:600px;background:#131320;color:#E8E4D8;font-family:"Shippori Mincho B1",serif;overflow:hidden}
  .card{position:absolute;inset:40px;border:2px solid #B89B5A;border-radius:10px;box-shadow:0 0 0 6px #131320,0 0 0 8px #6D5A33;display:flex;align-items:center;gap:48px;padding:48px}
  .art{width:340px;height:510px;border-radius:4px;border:2px solid #B89B5A;background:#1B1B2E center/cover no-repeat}
  h1{margin:0 0 12px;font-size:84px;letter-spacing:.12em;font-weight:800;color:#F0CE7E}
  .sub{font-size:26px;letter-spacing:.14em;color:#9D93B5}
  .lead{margin-top:28px;font-size:30px;line-height:1.7}
</style></head><body>
<div class="card"><div class="art" style="background-image:url(../assets/art/key.webp)"></div>
<div><h1>浄めばやし</h1><div class="sub">— 月蝕綺譚 -Luna Occulta- 二次創作 —</div><div class="lead">（一行で遊びの芯）</div></div></div>
</body></html>
